<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#7253ed">

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var checkLunr = setInterval(function() {
      if (typeof lunr !== 'undefined') {
        clearInterval(checkLunr);
        
        // 1. Unicode Trimmer тохируулах
        lunr.trimmer = function (token) {
          return token.update(function (str) {
            return str
              .replace(/^[^\p{L}\p{N}]+/u, '')
              .replace(/[^\p{L}\p{N}]+$/u, '');
          });
        };
        lunr.Pipeline.registerFunction(lunr.trimmer, 'unicodeTrimmer');

        // 2. Индексийг ID-ийн төрлийг анхаарч найдвартай дахин үүсгэх
        if (typeof docs !== 'undefined') {
          window.index = lunr(function(){
            this.ref('id');
            this.field('title', { boost: 200 });
            this.field('content', { boost: 2 });
            this.field('relUrl');
            this.metadataWhitelist = ['position'];

            this.pipeline.reset();
            this.pipeline.add(lunr.trimmer);

            this.searchPipeline.reset();
            this.searchPipeline.add(lunr.trimmer);

            for (var i in docs) {
              // ID-ийг String болон Number үл таарах асуудлаас сэргийлж цэвэрлэх
              this.add({
                id: String(i), 
                title: docs[i].title,
                content: docs[i].content,
                relUrl: docs[i].relUrl
              });
            }
          });
        }

        // 3. ХАМГААЛАЛТ: updateSearchFocus функцийг унахаас сэргийлэх monkey-patch
        // Just the Docs-ийн jtd обьект бэлэн болсон үед түүний функцийг overwrite хийнэ
        if (typeof window.jtd !== 'undefined' && window.jtd.updateSearchFocus) {
          var originalUpdateFocus = window.jtd.updateSearchFocus;
          window.jtd.updateSearchFocus = function() {
            try {
              // Функцийг ажиллуулж үзнэ, хэрэв null элемент олдвол унахгүй catch руу үсрэнэ
              originalUpdateFocus.apply(this, arguments);
            } catch (e) {
              console.warn("DOM-д хайлтын элемент хараахан үүсээгүй байна, алдааг алгаслаа.");
            }
          };
        }
        
        console.log("🚀 Кирилл хайлтын индекс болон хамгаалалт амжилттай идэвхжлээ!");
      }
    }, 100);
  });
</script>
