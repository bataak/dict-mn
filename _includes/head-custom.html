<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}">

<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "089229f2b5c34487b40c4b1cce8fb8de"}'></script>

<script>
  (function() {
    // Кирилл үсгийг үгийн тэмдэгт гэж таних Unicode Trimmer
    var cyrillicTrimmer = function (token) {
      return token.update(function (str) {
        return str
          .replace(/^[^\p{L}\p{N}]+/u, '')
          .replace(/[^\p{L}\p{N}]+$/u, '');
      });
    };

    // Хуучин JS файл кашнаас түрүүлж уншигдсан ч унахгүй байх глобал бэлтгэл
    window.jtd = window.jtd || {};
    window.jtd.updateSearchFocus = function() { return true; };
    window.jtd.searchLoaded = function() { return true; };

    // Lunr сан хөтөч дээр орж ирмэгц түүний суурь тохиргоог хүчээр өөрчлөх
    var waitForLunr = setInterval(function() {
      if (typeof lunr !== 'undefined') {
        
        // Lunr-ийн default trimmer-ийг өөрийнхөөрөө солих
        lunr.trimmer = cyrillicTrimmer;
        if (lunr.Pipeline) {
          lunr.Pipeline.registerFunction(lunr.trimmer, 'cyrillicTrimmer');
        }

        // Just the Docs-ийн хайлтын дата ачаалагдаж дуусах үед
        if (typeof docs !== 'undefined') {
          clearInterval(waitForLunr);

          // Индексийг кирилл тэмдэгтээр шинээр байгуулах
          window.index = lunr(function() {
            this.ref('id');
            this.field('title', { boost: 200 });
            this.field('content', { boost: 2 });
            this.field('relUrl');
            this.metadataWhitelist = ['position'];

            // Англи хэлний stopWordFilter болон stemmer-ийг хасаж, цэвэр кирилл хайлтыг үлдээнэ
            this.pipeline.reset();
            this.pipeline.add(lunr.trimmer);

            this.searchPipeline.reset();
            this.searchPipeline.add(lunr.trimmer);

            for (var i in docs) {
              this.add({
                id: String(i),
                title: docs[i].title,
                content: docs[i].content,
                relUrl: docs[i].relUrl
              });
            }
          });

          // Сүлжээний хоцрогдолоос унадаг updateSearchFocus функцийг хоосон болгож хамгаалах
          window.jtd.updateSearchFocus = function() { return true; };
          window.jtd.searchLoaded = function() { return true; };
          
          console.log("🚀 Хайлтын талбар кирилл индекс рүү амжилттай холбогдлоо!");
        }
      }
    }, 30);

    // Хайлтын өгөгдөл ямар нэг шалтгаанаар гацвал 5 секундын дараа интервалыг зогсооно
    setTimeout(function() { clearInterval(waitForLunr); }, 5000);
  })();
</script>
