<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#7253ed">

<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "089229f2b5c34487b40c4b1cce8fb8de"}'></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Хайлтын талбар байрлах DOM-ийг олох (Just the Docs дизайн хадгалах)
    var searchWrap = document.querySelector('.search-wrap');
    if (!searchWrap) return;

    // Хайлтын талбар болон үр дүн харах HTML-ийг гараар хүчээр оруулах
    searchWrap.innerHTML = `
      <div class="search" id="js-search">
        <div class="search-input-wrap">
          <input type="text" id="custom-search-input" class="search-input" tabindex="0" placeholder="Хайх үгээ бичнэ үү..." aria-label="Хайх үгээ бичнэ үү..." autocomplete="off">
          <label for="custom-search-input" class="search-label"><svg viewBox="0 0 24 24" class="search-icon"><use xlink:href="#svg-search"></use></svg></label>
        </div>
        <div id="custom-search-results" class="search-results" style="display: none;"></div>
      </div>
    `;

    var searchInput = document.getElementById('custom-search-input');
    var searchResults = document.getElementById('custom-search-results');

    // 2. Кирилл үсэг устгадаггүй цэвэр хайлтын мотор
    function nativeSearch(query, docs) {
      query = query.toLowerCase().trim();
      if (!query) return [];
      
      var matches = [];
      for (var id in docs) {
        var doc = docs[id];
        var titleScore = (doc.title || '').toLowerCase().includes(query) ? 10 : 0;
        var contentScore = (doc.content || '').toLowerCase().includes(query) ? 1 : 0;
        
        if (titleScore > 0 || contentScore > 0) {
          matches.push({
            id: id,
            doc: doc,
            score: titleScore + contentScore
          });
        }
      }
      // Илэрцийг оноогоор нь эрэмбэлэх (Гарчигт орсон бол дээр харагдана)
      return matches.sort(function(a, b) { return b.score - a.score; });
    }

    // 3. search-data.json файлыг сүлжээнээс найдвартай татаж авах
    fetch("{{ '/assets/js/search-data.json' | relative_url }}")
      .then(function(res) { return res.json(); })
      .then(function(docs) {
        
        // Хайлтын талбарт үг бичих үеийн логик
        searchInput.addEventListener('input', function() {
          var query = searchInput.value;
          var results = nativeSearch(query, docs);
          
          searchResults.innerHTML = '';
          if (!query.trim()) {
            searchResults.style.display = 'none';
            return;
          }

          searchResults.style.display = 'block';
          if (results.length === 0) {
            searchResults.innerHTML = '<p class="search-no-result" style="padding: 20px; color: #7253ed;">Илэрц олдсонгүй 😕</p>';
            return;
          }

          var ul = document.createElement('ul');
          ul.className = 'search-results-list';
          ul.style.listStyle = 'none';
          ul.style.padding = '0';

          results.forEach(function(item) {
            var li = document.createElement('li');
            li.className = 'search-result';
            li.style.borderBottom = '1px solid #eee';
            
            // Замын харьцангуй URL-ийг зөв тохируулах
            var baseUrl = "{{ '/' | relative_url }}".replace(/\/$/, '');
            var fullUrl = item.doc.relUrl.startsWith('http') ? item.doc.relUrl : baseUrl + item.doc.relUrl;

            li.innerHTML = `
              <a href="${fullUrl}" style="display: block; padding: 15px; text-decoration: none; color: #333;">
                <strong style="color: #7253ed;">${item.doc.title}</strong>
                <p style="margin: 5px 0 0 0; font-size: 0.85em; color: #666; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                  ${item.doc.content ? item.doc.content.substring(0, 160) + '...' : ''}
                </p>
              </a>
            `;
            ul.appendChild(li);
          });
          searchResults.appendChild(ul);
        });

      }).catch(function(err) {
        console.error("Хайлтын өгөгдлийг татаж чадсангүй:", err);
      });
  });
</script>
