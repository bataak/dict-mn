<script>
  (function() {
    // 1. Жэкилл/Jtd-ийн глобал jtd объектыг хуучин JS-ээс түрүүлж үүсгэж, алдаатай функцуудыг нь хоосон болгох
    window.jtd = window.jtd || {};
    
    // Консол дээр унаад байгаа функцуудыг юу ч хийдэггүй болгож урьдчилж дарах (Нэн чухал!)
    window.jtd.updateSearchFocus = function() { return true; };
    window.jtd.searchLoaded = function() { return true; };

    // 2. Кирилл үсэг устгадаггүй Unicode trimmer
    var cyrillicTrimmer = function (token) {
      return token.update(function (str) {
        return str
          .replace(/^[^\p{L}\p{N}]+/u, '')
          .replace(/[^\p{L}\p{N}]+$/u, '');
      });
    };

    // 3. Lunr бэлэн болохыг хүлээж, индексийг өөр дээрээ хүчээр үүсгэх логик
    var indexOverride = setInterval(function() {
      if (typeof lunr !== 'undefined') {
        
        // Глобал trimmer-ийг шинэчлэх
        lunr.trimmer = cyrillicTrimmer;
        if (lunr.Pipeline) {
          lunr.Pipeline.registerFunction(lunr.trimmer, 'cyrillicTrimmer');
        }

        // Хэрэв өгөгдөл (docs) болон Just the Docs-ийн индекс бэлэн болсон бол
        if (typeof docs !== 'undefined') {
          clearInterval(indexOverride);

          // Индексийг кириллээр зөв хайдаг болгож шинээр угсрах
          window.index = lunr(function() {
            this.ref('id');
            this.field('title', { boost: 200 });
            this.field('content', { boost: 2 });
            this.field('relUrl');
            this.metadataWhitelist = ['position'];

            this.pipeline.reset();
            this.pipeline.add(lunr.trimmer);

            this.searchPipeline.reset();
            this.searchPipeline.add(lunr.trimmer);

            for (var i in docs) {
              this.add({
                id: String(i), // ID-ийн төрлийг String болгож нэгтгэх
                title: docs[i].title,
                content: docs[i].content,
                relUrl: docs[i].relUrl
              });
            }
          });

          // Дахин нэг удаа jtd-ийн функцийг хамгаалах
          window.jtd.updateSearchFocus = function() { return true; };
          window.jtd.searchLoaded = function() { return true; };
          
          console.log("🚀 Кирилл хайлтын систем кашийг даран амжилттай идэвхжлээ.");
        }
      }
    }, 50);

    setTimeout(function() { clearInterval(indexOverride); }, 6000);
  })();
</script>
